<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animus</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/4c2fbb47e8.js" crossorigin="anonymous"></script>
    <script src="index.js" defer></script>
</head>

<body>
    <section id="banner">

        <nav>
            <figure class="nav__logo">
                <img class="logo__img" src="assets/Nexus-Logo.svg" alt="Logo">
                <div class="logo__name">Animus</div>
            </figure>
            <ul class="nav__links">
                <li class="nav__link">
                    <a class="nav__link--anchor link__hover-effect" href="index.html" target="_blank">Home</a>
                </li>
                <li class="nav__link">
                    <a class="nav__link--anchor link__hover-effect" href="#">Communities</a>
                </li>
                <li class="nav__link  click">
                    <a class="nav__link--anchor nav__link--primary" href="search.html">Browse</a>
                </li>
            </ul>
        </nav>

        <header class="banner">

            <div class="container">
                <h1 class="banner__title">Browse <span class="text-accent">Animus</span></h1>

                <div class="search-bar">
                    <input class="search-bar__input" type="text" placeholder="Search anime...">
                    <button>
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>

        </header>
    </section>
    <section id="gallery">

        <div class="search__tools wrapper">
            <h2 class="search-results__text">Search results for: <span id="search-query">"..."</span></h2>
            <div class="search-tools">

                <div class="filter__container">
                    <button class="filter-btn click" onclick="openFilter()" id="filter-btn-text">
                        <i class="fa-solid fa-filter"></i> Filter
                    </button>
                    <div class="filter__modal" id="filter-modal">
                        <div class="modal__header">
                            <h3>Filter By</h3>
                            <button class="close-modal click" onclick="closeFilter()">
                                <i class="fa-solid fa-times"></i>
                            </button>
                        </div>
                        <ul class="filter__list">
                            <li class="filter__option click" onclick="applyFilter('', 'All')">All</li>
                            <li class="filter__option click" onclick="applyFilter('tv', 'Shows')">Shows</li>
                            <li class="filter__option click" onclick="applyFilter('movie', 'Movies')">Movies</li>
                        </ul>
                    </div>
                </div>
                <div class="filter__container">
                    <button class="filter-btn click" onclick="openSort()" id="sort-btn-text">
                        <i class="fa-solid fa-sort"></i> Sort
                    </button>
                    <div class="filter__modal" id="sort-modal">
                        <div class="modal__header">
                            <h3>Sort By</h3>
                            <button class="close-modal click" onclick="closeSort()">
                                <i class="fa-solid fa-times"></i>
                            </button>
                        </div>
                        <ul class="filter__list">
                            <li class="filter__option click" onclick="applySort('score', 'Highest Rated')">Highest Rated</li>
                            <li class="filter__option click" onclick="applySort('rank', 'Ranking')">Ranking</li>
                            <li class="filter__option click" onclick="applySort('episodes', 'Episode Count')">Episode Count</li>
                        </ul>
                    </div>
                </div>

            </div>
        </div>

        <main class="results__gallery wrapper">
            <!-- API Inserted Here -->

        </main>
    </section>
</body>

</html>
