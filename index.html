<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animus</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/4c2fbb47e8.js" crossorigin="anonymous"></script>
    <script src="index.js" defer></script>
</head>

<body>
    <section id="home">
        <nav>
            <figure class="nav__logo">
                <img class="logo__img" src="assets/Nexus-Logo.svg" alt="Logo">
                <div class="logo__name">Animus</div>
            </figure>
            <ul class="nav__links">
                <li class="nav__link">
                    <a class="nav__link--anchor link__hover-effect" href="#">Home</a>
                </li>
                <li class="nav__link">
                    <a class="nav__link--anchor link__hover-effect" href="#">Communities</a>
                </li>
                <li class="nav__link  click">
                    <a class="nav__link--anchor nav__link--primary" href="#">Browse</a>
                </li>
            </ul>
        </nav>
        <header>
            <div class="container">
                <div class="header__description">
                    <h1>Your gateway to every world, every hero, and every story.</h1>
                    <h2>Find your next adventure with Animus</h2>
                </div>

                <div class="search-bar">
                    <input class="search-bar__input" type="text" placeholder="Search for your an anime, genre, or manga...">
                    <button>
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>
        </header>
    </section>
</body>

</html>
